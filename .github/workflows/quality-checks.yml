name: Quality Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      module-strategy:
        description: "Module integration strategy (spm or framework)"
        required: false
        default: framework
        type: choice
        options:
          - framework
          - spm

env:
  MODULE_STRATEGY: ${{ github.event.inputs.module-strategy || 'framework' }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: Scripts/CI

      # Pull requests that only touch documentation skip the test jobs. Anything that
      # cannot be classified runs the full pipeline.
      - name: Detect code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Manual run: running the full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
            CODE=$(echo "$FILES" | bash Scripts/CI/detect-code-changes.sh)
          else
            echo "::warning::Could not list the changed files: running the full pipeline"
            CODE=true
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Changed files:" && echo "$FILES" | sed 's/^/  /'
          echo "Code changes: $CODE"

      # Keeps a single comment on the PR explaining why the tests are skipped. It is updated
      # on every push and removed as soon as a commit touches code.
      - name: Comment PR about skipped tests
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          CODE_CHANGED: ${{ steps.filter.outputs.code }}
        with:
          script: |
            const marker = '<!-- ci-documentation-only -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));

            if (process.env.CODE_CHANGED === 'true') {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            const body = [
              marker,
              '## :information_source: Tests skipped: documentation-only change',
              '',
              'This pull request only changes documentation (`*.md`, `docs/**`, `.claude/**`), so the **Unit & Snapshot Tests**, **UI Tests** and the coverage report were not run. **Quality Gate** still reports success so the PR can be merged.',
              '',
              'Any commit that touches code (including `.github/**`, `Scripts/**`, `Tuist/**` and the tool configuration) runs the full pipeline again and removes this comment.'
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  unit-and-snapshot-tests:
    name: Unit & Snapshot Tests
    runs-on: xcode-27
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 40

    env:
      TUIST_TEST_DEVICE: iPhone 17 Pro
      TUIST_TEST_OS: "27.0"
      DERIVED_DATA_PATH: derived_data
      RESULT_BUNDLE_PATH: test_output/UnitSnapshot.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          device: ${{ env.TUIST_TEST_DEVICE }}
          os: ${{ env.TUIST_TEST_OS }}
          derived-data-prefix: unit
          module-strategy: ${{ env.MODULE_STRATEGY }}

      - name: Lint
        run: mise x -- swiftlint lint --strict --reporter github-actions-logging

      - name: Run unit and snapshot tests
        timeout-minutes: 35
        env:
          DESTINATION: "platform=iOS Simulator,name=${{ env.TUIST_TEST_DEVICE }},OS=${{ env.TUIST_TEST_OS }}"
          OUTPUT_DIR: test_output
        run: |
          source Scripts/test-helpers.sh
          run_tests "unit_snapshot" "Challenge.xcworkspace" "Challenge (Dev)" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -retry-tests-on-failure

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: unit-snapshot-coverage
          path: test_output
          retention-days: 1

      - name: Test report
        if: always()
        uses: ./.github/actions/test-report
        with:
          title: Unit & Snapshot Test Results
          artifact-name: unit-snapshot-results
          result-bundle-path: ${{ env.RESULT_BUNDLE_PATH }}

      - name: Detect dead code
        id: periphery
        continue-on-error: true
        run: |
          set +e
          INDEX_STORE="${DERIVED_DATA_PATH}/Index.noindex/DataStore"
          if [ -d "$INDEX_STORE" ]; then
            echo "Reusing index store: $INDEX_STORE"
            OUTPUT=$(mise x -- periphery scan --skip-build --index-store-path "$INDEX_STORE" 2>&1)
          else
            echo "Index store not found, running full build"
            OUTPUT=$(mise x -- periphery scan 2>&1)
          fi
          echo "$OUTPUT"
          echo 'PERIPHERY_OUTPUT<<PERIPHERY_EOF' >> "$GITHUB_ENV"
          echo "$OUTPUT" >> "$GITHUB_ENV"
          echo 'PERIPHERY_EOF' >> "$GITHUB_ENV"

      - name: Periphery summary
        id: periphery-summary
        shell: bash
        run: |
          BODY=$(node Scripts/CI/periphery-summary.js)
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<PERIPHERY_BODY_EOF"
            echo "$BODY"
            echo "PERIPHERY_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          PERIPHERY_OUTPUT: ${{ env.PERIPHERY_OUTPUT }}

      - name: Comment PR with Periphery results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_BODY: ${{ steps.periphery-summary.outputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.COMMENT_BODY
            });

  ui-tests:
    name: UI Tests
    runs-on: xcode-27
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 40

    env:
      TUIST_TEST_DEVICE: iPhone 17 Pro
      TUIST_TEST_OS: "27.0"
      DERIVED_DATA_PATH: derived_data
      RESULT_BUNDLE_PATH: test_output/UITests.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          device: ${{ env.TUIST_TEST_DEVICE }}
          os: ${{ env.TUIST_TEST_OS }}
          derived-data-prefix: ui
          module-strategy: ${{ env.MODULE_STRATEGY }}

      - name: Run UI tests
        timeout-minutes: 35
        env:
          DESTINATION: "platform=iOS Simulator,name=${{ env.TUIST_TEST_DEVICE }},OS=${{ env.TUIST_TEST_OS }}"
          OUTPUT_DIR: test_output
        run: |
          source Scripts/test-helpers.sh
          run_tests "ui" "Challenge.xcworkspace" "ChallengeUITests" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -retry-tests-on-failure \
            -test-repetition-relaunch-enabled YES

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-coverage
          path: test_output
          retention-days: 1

      - name: Test report
        if: always()
        uses: ./.github/actions/test-report
        with:
          title: UI Test Results
          artifact-name: ui-test-results
          result-bundle-path: ${{ env.RESULT_BUNDLE_PATH }}

  # Required status check. It always runs so the check is reported, but the macOS work
  # (coverage merge and threshold) only happens when the test jobs ran.
  quality-gate:
    name: Quality Gate
    runs-on: ${{ needs.changes.outputs.code == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    needs: [changes, unit-and-snapshot-tests, ui-tests]
    if: always()
    timeout-minutes: 10

    env:
      COVERAGE_THRESHOLD: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: Scripts/CI

      - name: Check job results
        run: |
          echo "Detect Changes: ${{ needs.changes.result }} (code changes: ${{ needs.changes.outputs.code }})"
          echo "Unit & Snapshot Tests: ${{ needs.unit-and-snapshot-tests.result }}"
          echo "UI Tests: ${{ needs.ui-tests.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Change detection failed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Documentation-only change: test jobs skipped, nothing to verify."
            echo "Documentation-only change: the test jobs were skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ needs.unit-and-snapshot-tests.result }}" != "success" ] || [ "${{ needs.ui-tests.result }}" != "success" ]; then
            echo "::error::One or more test jobs failed"
            exit 1
          fi

      - name: Download coverage artifacts
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'

      - name: Merge coverage data
        id: merge
        if: needs.changes.outputs.code == 'true'
        run: |
          mkdir -p merged-output
          if xcrun xcresulttool merge \
              unit-snapshot-coverage/UnitSnapshot.xcresult \
              ui-test-coverage/UITests.xcresult \
              --output-path merged-output/merged.xcresult 2>&1; then
            echo "merge_ok=true" >> "$GITHUB_OUTPUT"
            xcrun xccov view --report --json merged-output/merged.xcresult > coverage.json
          else
            echo "::warning::xcresulttool merge failed — falling back to independent coverage extraction"
            echo "merge_ok=false" >> "$GITHUB_OUTPUT"
            xcrun xccov view --report --json unit-snapshot-coverage/UnitSnapshot.xcresult > unit-coverage.json
            xcrun xccov view --report --json ui-test-coverage/UITests.xcresult > ui-coverage.json
          fi

      - name: Upload merged xcresult
        if: needs.changes.outputs.code == 'true' && steps.merge.outputs.merge_ok == 'true'
        id: upload-merged
        uses: actions/upload-artifact@v7
        with:
          name: merged-xcresult
          path: merged-output
          retention-days: 7

      - name: Upload unit xcresult
        if: needs.changes.outputs.code == 'true' && steps.merge.outputs.merge_ok != 'true'
        id: upload-unit
        uses: actions/upload-artifact@v7
        with:
          name: unit-snapshot-xcresult
          path: unit-snapshot-coverage
          retention-days: 7

      - name: Upload UI xcresult
        if: needs.changes.outputs.code == 'true' && steps.merge.outputs.merge_ok != 'true'
        id: upload-ui
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-xcresult
          path: ui-test-coverage
          retention-days: 7

      - name: Coverage report
        id: coverage
        if: needs.changes.outputs.code == 'true'
        shell: bash
        env:
          THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
          MERGE_OK: ${{ steps.merge.outputs.merge_ok }}
          COVERAGE_FILE: coverage.json
          UNIT_COVERAGE_FILE: unit-coverage.json
          UI_COVERAGE_FILE: ui-coverage.json
          DOWNLOAD_URL_MERGED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-merged.outputs.artifact-id }}
          DOWNLOAD_URL_UNIT: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-unit.outputs.artifact-id }}
          DOWNLOAD_URL_UI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-ui.outputs.artifact-id }}
        run: |
          RESULT=$(node Scripts/CI/coverage-report.js)
          BODY=$(echo "$RESULT" | jq -r '.body')
          TOTAL=$(echo "$RESULT" | jq -r '.total')
          PASSED=$(echo "$RESULT" | jq -r '.passed')
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<COVERAGE_BODY_EOF"
            echo "$BODY"
            echo "COVERAGE_BODY_EOF"
            echo "total=$TOTAL"
            echo "passed=$PASSED"
          } >> "$GITHUB_OUTPUT"

      - name: Comment PR with coverage
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_BODY: ${{ steps.coverage.outputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.COMMENT_BODY
            });

      - name: Enforce coverage threshold
        if: needs.changes.outputs.code == 'true' && steps.coverage.outputs.passed == 'false'
        run: |
          echo "::error::Code coverage (${{ steps.coverage.outputs.total }}%) is below the minimum threshold (${{ env.COVERAGE_THRESHOLD }}%)"
          exit 1
